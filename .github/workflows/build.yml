name: Build Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-22.04

    steps:
      # ── 1. Checkout your repo ──────────────────────────────────────────
      - name: Checkout code
        uses: actions/checkout@v4

      # ── 2. Set up Python 3.10 ─────────────────────────────────────────
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # ── 3. Set up Java 17 (required by Android Gradle) ────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # ── 4. Install system dependencies ────────────────────────────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -y
          sudo apt-get install -y \
            python3-pip \
            build-essential \
            git \
            zlib1g-dev \
            unzip \
            zip \
            libncurses5-dev \
            libffi-dev \
            libssl-dev \
            autoconf \
            libtool \
            pkg-config \
            cmake \
            libltdl-dev

      # ── 5. Install Buildozer & Cython ──────────────────────────────────
      - name: Install Buildozer
        run: |
          pip install --upgrade pip
          pip install buildozer==1.5.0
          pip install cython==0.29.33

      # ── 6. Cache Android SDK / NDK ────────────────────────────────────
      - name: Cache Android SDK/NDK
        uses: actions/cache@v4
        with:
          path: |
            ~/.buildozer/android/platform
            ~/.buildozer/android/packages
          key: android-sdk-${{ hashFiles('buildozer.spec') }}
          restore-keys: |
            android-sdk-

      # ── 7. Build APK ──────────────────────────────────────────────────
      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee build.log

      # ── 8. Upload APK as artifact ─────────────────────────────────────
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: buddy-guard-apk
          path: bin/*.apk
          if-no-files-found: error

      # ── 9. Upload build log (always, so you can debug failures) ───────
      - name: Upload build log
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log
